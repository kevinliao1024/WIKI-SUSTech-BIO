  <title id="astro-title">A star-shaped glial cell</title>
  <desc id="astro-desc">An original cartoon astrocyte with seven organic branching arms, a lavender membrane, coral cytoplasm, and a luminous lavender nucleus. Small rounded vesicles and mitochondria suggest the living world inside.</desc>
  <metadata>Original code-native artwork created with AI assistance for the SUSTech 2026 ORCA design preview. No third-party artwork or external resources. Intended page: homepage. Decorative conceptual illustration, not an anatomical measurement. Team review required before publication.</metadata>
