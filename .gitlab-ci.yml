image: python:3.12

pages:
  stage: build
  variables:
    WIKI_ASSET_MODE: "igem"
  script:
    - pip install --no-cache-dir -r dependencies.txt
    - python scripts/build_asset_mapping.py
    - WIKI_ASSET_MODE=local python -m unittest discover -s tests -v
    - FLASK_APP=app.py flask freeze
    - python scripts/audit_build.py --require-cdn --asset-report asset-build-report.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # No runners will run on branches other than main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
