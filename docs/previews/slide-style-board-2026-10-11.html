<style>
#slide-style-board .sb{--s-bg:#080d17;--s-ink:#f0f3f8;--s-mute:#a3b0c5;--s-line:#303c52;--s-glass:#15243b;--s-accent:#b8c9ec;--s-stain:#829ccc;--s-nucleus:#dbe7fc;--s-label:#e1e5ed;--s-label-ink:#192638;--s-grain:.32;box-sizing:border-box;min-height:700px;background:var(--s-bg);color:var(--s-ink);padding:32px;font:14px/1.5 Arial,"PingFang SC",sans-serif;position:relative;isolation:isolate;overflow:hidden;color-scheme:dark}
#slide-style-board .sb *{box-sizing:border-box}
#slide-style-board .sb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
#slide-style-board .sb-overline{font:11px/1.4 ui-monospace,monospace;letter-spacing:.15em;color:var(--s-mute);margin:0 0 12px}
#slide-style-board h2{font:400 clamp(31px,5.2vw,43px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:0}
#slide-style-board .sb-style{font-size:11px;letter-spacing:.12em;border:1px solid var(--s-line);padding:5px 8px;white-space:nowrap;color:var(--s-mute);margin-top:3px}
#slide-style-board .sb-palette{display:flex;gap:20px;flex-wrap:wrap;font:11px/1.5 ui-monospace,monospace;color:var(--s-mute);margin:20px 0 0}
#slide-style-board .sb-palette span{display:flex;gap:6px;align-items:center}
#slide-style-board .sb-palette i{width:9px;height:9px;border:1px solid var(--s-line);display:inline-block;background:var(--s-accent)}
#slide-style-board .sb-palette span:nth-child(2) i{background:var(--s-stain)}
#slide-style-board .sb-palette span:nth-child(3) i{background:var(--s-label)}
#slide-style-board .sb-collection{height:365px;display:flex;align-items:center;justify-content:center;gap:14px;position:relative;perspective:900px;margin:16px 0 22px}
#slide-style-board .sb-plate{position:relative;flex:1;min-width:0;max-width:125px;height:288px;padding:8px;border:1px solid #7183a166;border-radius:3px;color:var(--s-label-ink);background:linear-gradient(125deg,#ffffff18,transparent 24%,#ffffff06 51%,#ffffff16 52%,transparent 53%),linear-gradient(100deg,var(--s-glass),var(--s-bg));box-shadow:inset 1px 0 0 #e7f3ff36,inset -1px 0 0 #e7f3ff13,5px 18px 25px #0006;transform:translateY(var(--s-y)) rotate(var(--s-r));transition:transform .48s cubic-bezier(.2,.7,.2,1),border-color .4s,box-shadow .4s;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;text-align:left;font:inherit;isolation:isolate}
#slide-style-board .sb-plate:nth-child(1){--s-y:14px;--s-r:-4deg}
#slide-style-board .sb-plate:nth-child(2){--s-y:0px;--s-r:-2deg}
#slide-style-board .sb-plate:nth-child(3){--s-y:17px;--s-r:2deg}
#slide-style-board .sb-plate:nth-child(4){--s-y:-3px;--s-r:-1deg}
#slide-style-board .sb-plate:nth-child(5){--s-y:15px;--s-r:4deg}
#slide-style-board .sb-plate:hover,#slide-style-board .sb-plate[aria-pressed="true"]{transform:translateY(-13px) rotate(0);border-color:var(--s-accent);box-shadow:inset 0 0 12px #cfddfa12,0 16px 35px #0005,0 0 20px #8da6dd16;z-index:2}
#slide-style-board .sb-serial{font:11px/1.2 ui-monospace,monospace;letter-spacing:.04em;color:var(--s-mute)}
#slide-style-board .sb-sample{height:144px;position:relative;display:block;margin:9px 0 18px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#bdd7ff08,transparent 67%);transform:rotate(-12deg);pointer-events:none}
#slide-style-board .sb-sample::before{content:"";position:absolute;inset:18px 3px;border:1px solid color-mix(in srgb,var(--s-accent) 16%,transparent);border-radius:52% 48% 65% 35%;transform:rotate(16deg)}
#slide-style-board .sb-cell{position:absolute;display:block;border-radius:43% 57% 37% 63% / 52% 45% 55% 48%;border:1px solid color-mix(in srgb,var(--s-stain) 80%,transparent);background:radial-gradient(ellipse at 52% 45%,var(--s-nucleus) 0 5%,transparent 10%),radial-gradient(ellipse at 42% 53%,color-mix(in srgb,var(--s-stain) 16%,transparent) 0 32%,color-mix(in srgb,var(--s-stain) 45%,transparent) 63%,transparent 73%);box-shadow:inset 1px 1px 5px color-mix(in srgb,var(--s-accent) 35%,transparent),0 0 8px color-mix(in srgb,var(--s-stain) 15%,transparent)}
#slide-style-board .sb-cell::after{content:"";position:absolute;inset:10%;border:1px solid color-mix(in srgb,var(--s-stain) 28%,transparent);border-radius:inherit}
#slide-style-board .sb-cell:nth-child(1){width:50%;height:40%;left:7%;top:24%;transform:rotate(-14deg)}
#slide-style-board .sb-cell:nth-child(2){width:45%;height:37%;left:50%;top:16%;transform:rotate(20deg)}
#slide-style-board .sb-cell:nth-child(3){width:41%;height:31%;left:36%;top:57%;transform:rotate(42deg)}
#slide-style-board .sb-cell:nth-child(4){width:28%;height:22%;left:14%;top:4%;transform:rotate(60deg)}
#slide-style-board .sb-grain{position:absolute;inset:8% 1%;background:radial-gradient(circle,color-mix(in srgb,var(--s-accent) 65%,transparent) .7px,transparent 1.2px);background-size:7px 9px;opacity:var(--s-grain);border-radius:48%;mask-image:radial-gradient(ellipse,#000,transparent 71%)}
#slide-style-board .sb-plate:nth-child(2) .sb-sample{transform:rotate(17deg)}
#slide-style-board .sb-plate:nth-child(3) .sb-sample{transform:rotate(78deg) scale(.9)}
#slide-style-board .sb-plate:nth-child(4) .sb-sample{transform:rotate(-38deg) scale(.85)}
#slide-style-board .sb-plate:nth-child(5) .sb-sample{transform:rotate(155deg)}
#slide-style-board .sb-label{background:var(--s-label);color:var(--s-label-ink);min-height:67px;padding:11px 8px;display:flex;align-items:flex-start;flex-direction:column;justify-content:space-between;gap:5px;font-size:13px;font-weight:500;line-height:1.3;position:relative}
#slide-style-board .sb-label small{font:11px ui-monospace,monospace;opacity:.68;letter-spacing:.04em}
#slide-style-board .sb-dock{border-top:1px solid var(--s-line);display:grid;grid-template-columns:130px 1fr;gap:16px;padding-top:19px;min-height:104px;align-content:start}
#slide-style-board .sb-dock h3{margin:8px 0 0;font:400 14px Arial,sans-serif}
#slide-style-board .sb-links{display:flex;flex-wrap:wrap;gap:4px 17px}
#slide-style-board .sb-links button{font:12px/1.4 Arial,sans-serif;color:var(--s-mute);padding:8px 0;background:transparent;border:0;border-bottom:1px solid transparent;text-align:left;min-height:34px}
#slide-style-board .sb-links button:hover{color:var(--s-ink);border-bottom-color:var(--s-accent)}
#slide-style-board .sb-note{font:11px/1.4 ui-monospace,monospace;color:var(--s-mute);margin:11px 0 0;min-height:16px}
#slide-style-board .archive{--s-bg:#e9e6da;--s-ink:#282b22;--s-mute:#5b6152;--s-line:#b8baa9;--s-glass:#dadfce;--s-accent:#899b70;--s-stain:#72835a;--s-nucleus:#35432f;--s-label:#d7d4be;--s-label-ink:#222b21;color-scheme:light}
#slide-style-board .archive h2{font-family:Arial,sans-serif;font-weight:500;letter-spacing:-.065em}
#slide-style-board .archive .sb-collection{flex-direction:column;gap:10px;align-items:stretch;padding:8px 12px 8px 0}
#slide-style-board .archive .sb-plate{max-width:none;width:97%;height:61px;min-height:61px;flex:none;display:grid;grid-template-columns:63px 1fr 150px;align-items:center;gap:12px;padding:6px 10px;transform:translateX(0);border:1px solid #98a5888c;background:linear-gradient(100deg,#e2e7d7,#f0f1e9 70%,#d9e0cb);box-shadow:1px 3px 0 #bebfac70;border-radius:2px}
#slide-style-board .archive .sb-plate:hover,#slide-style-board .archive .sb-plate[aria-pressed="true"]{transform:translateX(12px);border-color:#657c4c;box-shadow:-12px 0 0 #8392673b,0 6px 13px #444c2220}
#slide-style-board .archive .sb-serial{border-right:1px solid #b9c4a9;padding-right:10px}
#slide-style-board .archive .sb-sample{position:absolute;width:130px;height:50px;right:8px;top:2px;margin:0;transform:rotate(0)!important;opacity:.85;overflow:hidden;border-radius:20px}
#slide-style-board .archive .sb-cell:nth-child(2){left:45%;top:10%}
#slide-style-board .archive .sb-label{grid-column:2;grid-row:1;background:transparent;min-height:0;display:block;padding:0;font:16px/1.2 Georgia,serif}
#slide-style-board .archive .sb-label small{display:none}
#slide-style-board .archive .sb-sample::before{inset:5px 8px}
#slide-style-board .stained{--s-bg:#efe8ec;--s-ink:#342638;--s-mute:#6d5870;--s-line:#cbbbcc;--s-glass:#e7dfeb;--s-accent:#ba739b;--s-stain:#c782ae;--s-nucleus:#644971;--s-label:#f7f0ee;--s-label-ink:#442c48;--s-grain:.6;color-scheme:light}
#slide-style-board .stained .sb-collection{gap:11px}
#slide-style-board .stained .sb-plate{border-color:#96758c6b;transform:translateY(0);background:linear-gradient(135deg,#fff8,transparent 24%,#fff4 47%,transparent 48%),linear-gradient(100deg,#e4dfea,#f2e8ef);box-shadow:3px 8px 0 #af8da414}
#slide-style-board .stained .sb-plate:nth-child(even){transform:translateY(18px)}
#slide-style-board .stained .sb-plate:hover,#slide-style-board .stained .sb-plate[aria-pressed="true"]{transform:translateY(-10px);box-shadow:0 12px 25px #895b8429;border-color:#95507d}
#slide-style-board .stained .sb-sample{background:radial-gradient(ellipse at 50% 50%,#c28aaa5e,transparent 68%)}
#slide-style-board .stained .sb-cell{border-radius:37% 63% 44% 56% / 43% 65% 35% 57%;border-color:#9b5e927d;background:radial-gradient(ellipse at 38% 39%,#654875 0 9%,transparent 12%),radial-gradient(ellipse at 72% 61%,#7f548578 0 6%,transparent 9%),radial-gradient(ellipse,#dcb4c9,#b580ba8c);box-shadow:inset 0 0 6px #82417a38}
#slide-style-board .stained .sb-label{border-top:2px solid #b3789a;background:#f5eeed}
#slide-style-board .stained .sb-label small{letter-spacing:.06em}
@media(max-width:560px){
 #slide-style-board .sb{padding:26px 18px 20px;min-height:790px}
 #slide-style-board .sb-head{display:block}
 #slide-style-board .sb-style{display:inline-block;margin-top:13px}
 #slide-style-board h2{font-size:31px}
 #slide-style-board .sb-palette{gap:8px 13px;margin-top:14px;font-size:11px}
 #slide-style-board .sb-collection{height:402px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px 12px;margin:30px 0 24px;align-content:center}
 #slide-style-board .sb-plate{height:176px;width:100%;max-width:none;padding:5px;transform:rotate(0);--s-y:0px!important;--s-r:0deg!important}
 #slide-style-board .sb-plate:hover,#slide-style-board .sb-plate[aria-pressed="true"]{transform:translateY(-5px)}
 #slide-style-board .sb-serial{font-size:11px;letter-spacing:0}
 #slide-style-board .sb-sample{height:64px;margin:4px 0}
 #slide-style-board .sb-label{min-height:64px;padding:6px 4px;font-size:12px;overflow-wrap:normal}
 #slide-style-board .sb-label small{font-size:11px;letter-spacing:0}
 #slide-style-board .sb-dock{display:block;min-height:119px;padding-top:14px}
 #slide-style-board .sb-dock h3{margin:0 0 6px}
 #slide-style-board .sb-links{gap:0 13px}
 #slide-style-board .sb-links button{min-height:40px}
 #slide-style-board .archive .sb-collection{display:flex;justify-content:center;margin-top:20px;margin-bottom:34px}
 #slide-style-board .archive .sb-plate{height:67px;min-height:67px;grid-template-columns:45px 1fr;gap:9px;width:98%;padding:6px}
 #slide-style-board .archive .sb-serial{font-size:11px;padding-right:6px}
 #slide-style-board .archive .sb-label{font-size:15px;padding-right:36px}
 #slide-style-board .archive .sb-sample{width:50px;right:1px;opacity:.5}
 #slide-style-board .archive .sb-plate:hover,#slide-style-board .archive .sb-plate[aria-pressed="true"]{transform:translateX(7px)}
 #slide-style-board .stained .sb-plate:nth-child(even){transform:none}
 #slide-style-board .stained .sb-plate[aria-pressed="true"]{transform:translateY(-5px)}
}
@media(prefers-reduced-motion:reduce){#slide-style-board .sb-plate{transition:none}}
</style>
<div id="slide-style-board">
 <div class="viz-carousel viz-dotted-background" aria-label="长方形载玻片风格看板" data-previous-label="上一种风格" data-next-label="下一种风格">
  <section data-variant="暗场微光">
   <div class="sb darkfield" aria-label="暗场微光载玻片">
    <div class="sb-head"><div><p class="sb-overline">ORCA / SPECIMEN INDEX</p><h2>Explore the <em>project.</em></h2></div><span class="sb-style">暗场微光</span></div>
    <div class="sb-palette"><span><i></i>冷灰玻璃</span><span><i></i>银蓝切片</span><span><i></i>纸质标签</span></div>
    <div class="sb-collection" role="group" aria-label="五个项目章节"></div>
    <div class="sb-dock" aria-live="polite"><h3>Project ↗</h3><div class="sb-links"></div></div>
    <p class="sb-note">方形薄边 / 错落陈列 / 抽出查看</p>
   </div>
  </section>
  <section data-variant="磨砂档案" hidden>
   <div class="sb archive" aria-label="磨砂档案载玻片">
    <div class="sb-head"><div><p class="sb-overline">ORCA / RESEARCH ARCHIVE</p><h2>Explore the project.</h2></div><span class="sb-style">磨砂档案</span></div>
    <div class="sb-palette"><span><i></i>鼠尾草绿</span><span><i></i>磨砂样本</span><span><i></i>暖灰纸面</span></div>
    <div class="sb-collection" role="group" aria-label="五个项目章节"></div>
    <div class="sb-dock" aria-live="polite"><h3>Project ↗</h3><div class="sb-links"></div></div>
    <p class="sb-note">横向长片 / 档案抽屉 / 侧向抽出</p>
   </div>
  </section>
  <section data-variant="染色切片" hidden>
   <div class="sb stained" aria-label="染色切片载玻片">
    <div class="sb-head"><div><p class="sb-overline">ORCA / CELL COLLECTION</p><h2>Explore the <em>project.</em></h2></div><span class="sb-style">染色切片</span></div>
    <div class="sb-palette"><span><i></i>玫瑰染色</span><span><i></i>紫色细胞核</span><span><i></i>乳白标签</span></div>
    <div class="sb-collection" role="group" aria-label="五个项目章节"></div>
    <div class="sb-dock" aria-live="polite"><h3>Project ↗</h3><div class="sb-links"></div></div>
    <p class="sb-note">透光玻片 / 组织纹理 / 标本展柜</p>
   </div>
  </section>
 </div>
 <template id="sb-plate-template"><button type="button" class="sb-plate cursor-interaction" aria-pressed="false"><span class="sb-serial"></span><span class="sb-sample" aria-hidden="true"><i class="sb-cell"></i><i class="sb-cell"></i><i class="sb-cell"></i><i class="sb-cell"></i><i class="sb-grain"></i></span><span class="sb-label"><span class="sb-name"></span><small></small></span></button></template>
</div>
<script>
(() => {
 const root=document.getElementById('slide-style-board');
 const groups={Team:['Team','Attributions'],Project:['Description','Engineering','Contribution','Parts'],'Wet Lab':['Experiments','Results','Notebook','Measurement','Alternative Platform','Safety & Security'],'Dry Lab':['Model','Software'],'Human Practices':['Human Practices','Education','Entrepreneurship','Inclusivity','Sustainability']};
 const stages=Array.from(root.querySelectorAll('.sb'));
 const choose=(stage,group)=>{
  if(!groups[group])group='Project';
  stage.querySelectorAll('.sb-plate').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));
  stage.querySelector('.sb-dock h3').textContent=group+' ↗';
  const links=stage.querySelector('.sb-links');links.replaceChildren();
  groups[group].forEach(name=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.textContent=name+' ↗';b.addEventListener('click',()=>{stage.querySelector('.sb-note').textContent='入口预览 · '+name});links.appendChild(b)});
 };
 stages.forEach(stage=>{
  Object.entries(groups).forEach(([group,items],index)=>{
   const b=root.querySelector('template').content.firstElementChild.cloneNode(true);
   b.dataset.group=group;b.setAttribute('aria-label',group+'，'+items.length+' 个页面');
   b.querySelector('.sb-serial').textContent='OR—0'+(index+1);
   b.querySelector('.sb-name').textContent=group;
   b.querySelector('.sb-label small').textContent=String(items.length).padStart(2,'0')+' PAGES';
   b.addEventListener('click',()=>{
    choose(stage,group);
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{slideStyle:stage.parentElement.dataset.variant,selectedGroup:group},privateContent:{selections:Object.fromEntries(stages.map(s=>[s.parentElement.dataset.variant,s.querySelector('[aria-pressed="true"]').dataset.group]))}}).catch(()=>{});
   });
   stage.querySelector('.sb-collection').appendChild(b);
  });
  choose(stage,'Project');
  if(globalThis.Tweak){
   const state={grain:parseFloat(getComputedStyle(stage).getPropertyValue('--s-grain'))};
   const tweaks=new Tweak({container:stage,onChange:()=>stage.style.setProperty('--s-grain',String(state.grain))});
   tweaks.addSlider(state,'grain',{min:0,max:.7,step:.05,label:'切片颗粒密度',reference:'--s-grain'});
  }
 });
 const restore=saved=>{const selections=saved?.privateContent?.selections||{};stages.forEach(stage=>choose(stage,selections[stage.parentElement.dataset.variant]||'Project'))};
 restore(window.openai?.widgetState);
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState)});
})();
</script>
