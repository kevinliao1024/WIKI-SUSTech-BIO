<script>
(() => {
 const root = document.getElementById('explore-directions');
 const groups = {Team:['Team','Attributions'],Project:['Description','Engineering','Contribution','Parts'],'Wet Lab':['Experiments','Results','Notebook','Measurement','Alternative Platform','Safety & Security'],'Dry Lab':['Model','Software'],'Human Practices':['Human Practices','Education','Entrepreneurship','Inclusivity','Sustainability']};
 const stages = Array.from(root.querySelectorAll('.ex-stage'));
 function renderGroup(stage, group) {
  if (!groups[group]) group = 'Project';
  stage.querySelectorAll('[data-group]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.group === group)));
  stage.querySelector('.ex-dock-name').textContent = group + ' ↗';
  const links = stage.querySelector('.ex-links');
  links.replaceChildren();
  groups[group].forEach(label => {
   const button = document.createElement('button');
   button.type = 'button'; button.className = 'cursor-interaction';button.textContent = label + ' ↗';
   button.addEventListener('click',() => {stage.querySelector('.ex-preview').textContent = '预览入口 · ' + label;});
   links.appendChild(button);
  });
  stage.querySelector('.ex-preview').textContent = '';
 }
 function restore(saved) {
  const selections = saved?.privateContent?.selections || {};
  stages.forEach(stage=>renderGroup(stage,selections[stage.getAttribute('aria-label')] || 'Project'));
 }
 restore(window.openai?.widgetState);
 stages.forEach(stage => {
  stage.querySelectorAll('[data-group]').forEach(button=>button.addEventListener('click',()=>{
   renderGroup(stage,button.dataset.group);
   const selections = Object.fromEntries(stages.map(item=>[item.getAttribute('aria-label'),item.querySelector('[aria-pressed="true"]').dataset.group]));
   if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{previewedDesign:stage.parentElement.dataset.variant,selectedSection:button.dataset.group},privateContent:{selections}}).catch(()=>{});
  }));
  if(globalThis.Tweak){
   const palette = {accent:getComputedStyle(stage).getPropertyValue('--ex-accent').trim()};
   const tweak = new Tweak({container:stage,onChange:()=>stage.style.setProperty('--ex-accent',palette.accent)});
   tweak.addColorPicker(palette,'accent',{label:'点缀色',reference:'--ex-accent'});
  }
 });
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState)});
})();
</script>
