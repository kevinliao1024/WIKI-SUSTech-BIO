<section
  class="reversal-scene"
  data-reversal-scene
  aria-label="The turning point: the question 'what if we can reverse it' leads back to the top of the page, where the central cytosine is corrected to uracil."
>
  <div class="reversal-scene__viewport" data-reversal-viewport>
    <div class="reversal-scene__wash" aria-hidden="true"><i></i><i></i></div>

    <div class="reversal-scene__lobes" data-reversal-lobes aria-hidden="true">
      <img src="{{ url_for('assets', filename='hero_lib/protein_states/protein_cluster_three.webp') }}" alt="" draggable="false">
    </div>

    <div class="reversal-scene__spot" data-reversal-spot aria-hidden="true">
      <img src="{{ url_for('assets', filename='hero_lib/protein_states/protein_blob_plain.webp') }}" alt="" draggable="false">
    </div>

    <div class="reversal-scene__bases" aria-hidden="true">
      <span class="reversal-base reversal-base--u" data-reversal-base="u">G</span>
      <span class="reversal-base reversal-base--focus" data-reversal-base="focus">
        <b data-reversal-letter>c</b>
      </span>
      <span class="reversal-base reversal-base--c" data-reversal-base="c">G</span>
    </div>

    <header class="reversal-scene__copy" data-reversal-copy>
      <h2>What if we can<br>reverse it?</h2>
      <span data-reversal-sub>One letter decides which protein is made</span>
    </header>

    <div class="reversal-scene__rewind" data-reversal-rewind aria-hidden="true">
      <i data-reversal-drain></i>
      <span>Returning to the sequence</span>
    </div>

    <div class="reversal-scene__flash" data-reversal-flash aria-hidden="true"></div>

    <div class="reversal-scene__progress" aria-hidden="true">
      <span>05</span><i><b data-reversal-bar></b></i><span>06</span>
    </div>
  </div>
</section>
