<section
  class="rna-opening brain-journey"
  data-rna-opening
>
  <div class="rna-opening__viewport" data-rna-viewport>
    <div class="rna-opening__wash" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>

    <div class="journey-atmosphere" aria-hidden="true">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"><path d="M-150 760 C240 940 250 300 710 370 S1320 820 1540 160"/><path d="M-100 720 C250 900 310 280 710 350 S1300 740 1530 120"/></svg>
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <header class="journey-intro" data-journey-intro>
      <h1 class="visually-hidden">ORCA</h1>
      <p class="visually-hidden">On-target RNA Correction for Alzheimer’s Disease</p>
      {% include 'components/crayon_title.html' %}
    </header>
    <div class="journey-brain" data-journey-brain>
      {% include 'components/crayon_brain.html' %}
    </div>
    <div class="journey-astrocyte" data-journey-astrocyte>
      <img src="{{ url_for('static', filename='assets/brain-journey/astrocyte.svg') }}" alt="A star-shaped astrocyte with branching processes and a central nucleus" width="1000" height="900">
    </div>
    <div class="journey-scale" aria-hidden="true">
      <span data-journey-label="brain">The brain</span>
      <span data-journey-label="astrocyte">An astrocyte</span>
      <span data-journey-label="rna">Inside, a single sequence.</span>
    </div>

    <figure class="rna-opening__stage" data-journey-rna aria-label="A highlighted cytosine settles into an RNA sequence containing G, C and G as the strand stabilizes.">
      <div class="rna-opening__source" data-rna-source aria-hidden="true">
        <span>C</span>
        <i></i><i></i><i></i>
      </div>

      <div class="rna-opening__guide" data-rna-guide aria-hidden="true">
        <i></i><i></i><i></i>
      </div>

      <div class="rna-opening__strand" data-rna-strand aria-hidden="true">
        <img
          src="{{ url_for('static', filename='assets/brain-journey/rna.svg') }}"
          alt=""
          draggable="false"
        >
      </div>

      <div class="rna-opening__bases" aria-hidden="true">
        <span class="rna-base rna-base--u" data-rna-base="u">G</span>
        <span class="rna-base rna-base--focus" data-rna-base="focus">C</span>
        <span class="rna-base rna-base--c" data-rna-base="c">G</span>
      </div>


      <div class="rna-opening__cell-particles" data-rna-cell-particles aria-hidden="true">
        <img src="{{ url_for('assets', filename='hero/cell/coral-particles.png') }}" alt="" draggable="false">
      </div>

      <div class="rna-opening__cell-halo" data-rna-cell-halo aria-hidden="true"><i></i><i></i></div>

      <div class="rna-opening__cell-character" data-rna-cell-character aria-hidden="true">
        <img src="{{ url_for('assets', filename='hero/cell/red-cell-main.png') }}" alt="" draggable="false">
      </div>

      <div class="rna-opening__cell-tissue" data-rna-cell-tissue aria-hidden="true">
        <img src="{{ url_for('assets', filename='hero/cell/tissue-wave.png') }}" alt="" draggable="false">
      </div>

      <div class="rna-opening__cell-copy" data-rna-cell-copy>
        <h2>The strain<br>becomes visible.</h2>

      </div>

      <div class="rna-opening__cell-caption" data-rna-cell-caption>
        <b>Molecular change</b><i></i><b>Cellular response</b>
      </div>

      <div class="rna-opening__cleaners" aria-hidden="true">
        <img class="rna-cleaners rna-cleaners--ready" data-rna-clearance-state="ready" src="{{ url_for('assets', filename='hero/clearance/cleaners-ready.png') }}" alt="" draggable="false">
        <img class="rna-cleaners rna-cleaners--strained" data-rna-clearance-state="strained" src="{{ url_for('assets', filename='hero/clearance/cleaners-strained.png') }}" alt="" draggable="false">
        <img class="rna-cleaners rna-cleaners--exhausted" data-rna-clearance-state="exhausted" src="{{ url_for('assets', filename='hero/clearance/cleaners-exhausted.png') }}" alt="" draggable="false">
      </div>

      <div class="rna-opening__clearance-copy" data-rna-clearance-copy>
        <h2>The clean-up<br>cannot keep up.</h2>

      </div>

      <div class="rna-opening__clearance-status" data-rna-clearance-status aria-live="polite">
        <span>Response</span><i></i><b>Recruiting</b>
      </div>
    </figure>

    <div class="rna-opening__progress" aria-hidden="true">
      <span>01</span><i><b data-rna-progress></b></i><span>03</span>
    </div>

  </div>
</section>
