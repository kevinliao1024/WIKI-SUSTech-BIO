<section class="mrna-hero" data-hero-scene data-phase="unstable" aria-label="ORCA mRNA minimal scroll scene">
  <div class="mrna-hero__pin" data-hero-pin>
    <figure
      class="mrna-hero__canvas"
      aria-label="A single mRNA wave resolving into U-C-C nucleotide markers and straightening upon scroll."
    >
      <!-- 1440x900 虚拟舞台容器 -->
      <div class="mrna-stage" id="mrna-stage">

        <!-- 1. mrnaWave: 波浪状 mRNA (双层结构：静态 + 变形拉直) -->
        <div
          id="hero-wave"
          class="mrna-hero__asset mrna-hero__asset--wave"
          data-asset="wave_1.png"
        >
          <div class="mrna-hero__crop mrna-hero__wave-static" data-wave-static>
            <img src="{{ url_for('assets', filename='hero/mrna/wave_1.png') }}" alt="" draggable="false">
          </div>
          <!-- 变形层：由两个分段在拉直阶段执行反向旋转与位移 -->
          <div class="mrna-hero__wave-deform" data-wave-deform aria-hidden="true">
            <span
              id="hero-wave-seg-1"
              class="mrna-hero__wave-segment mrna-hero__wave-segment--1"
              data-wave-segment
              data-shift="-18"
              data-rotation="-7.2"
            >
              <img src="{{ url_for('assets', filename='hero/mrna/wave_1.png') }}" alt="" draggable="false">
            </span>
            <span
              id="hero-wave-seg-2"
              class="mrna-hero__wave-segment mrna-hero__wave-segment--2"
              data-wave-segment
              data-shift="-18"
              data-rotation="4.5"
            >
              <img src="{{ url_for('assets', filename='hero/mrna/wave_1.png') }}" alt="" draggable="false">
            </span>
          </div>
          <span class="mrna-hero__debug-label" aria-hidden="true">
            <b>#hero-wave · wave_1.png</b>
            <span>Center (720, 560)</span>
          </span>
        </div>

        <!-- 2. sideU: 左边小的粉色 U (target center: 610, 535) -->
        <div
          id="hero-marker-u-left"
          class="mrna-hero__asset mrna-hero__asset--marker mrna-hero__asset--left"
          data-asset="pink_spot_1.png"
          data-char="U"
          aria-hidden="true"
        >
          <div class="mrna-hero__crop" data-marker-crop>
            <img src="{{ url_for('assets', filename='hero/mrna/pink_spot_1.png') }}" alt="" draggable="false">
            <span class="mrna-marker-letter">U</span>
          </div>
          <span class="mrna-hero__debug-label" aria-hidden="true">
            <b>#hero-marker-u-left · U</b>
            <span>Target (610, 535) · scale 0.5</span>
          </span>
        </div>

        <!-- 3. mainC: 中间大的深蓝色 C (target center: 720, 560) -->
        <div
          id="hero-marker-c-target"
          class="mrna-hero__asset mrna-hero__asset--marker mrna-hero__asset--center"
          data-asset="blue_spot_1.png"
          data-char="C"
          aria-hidden="true"
        >
          <div class="mrna-hero__crop" data-marker-crop>
            <img src="{{ url_for('assets', filename='hero/mrna/blue_spot_1.png') }}" alt="" draggable="false">
            <span class="mrna-marker-letter">C</span>
          </div>
          <span class="mrna-hero__debug-label" aria-hidden="true">
            <b>#hero-marker-c-target · C</b>
            <span>Target (720, 560) · scale 1.0</span>
          </span>
        </div>

        <!-- 4. sideC: 右边小的粉色 C (target center: 850, 570) -->
        <div
          id="hero-marker-c-right"
          class="mrna-hero__asset mrna-hero__asset--marker mrna-hero__asset--right"
          data-asset="pink_spot_2.png"
          data-char="C"
          aria-hidden="true"
        >
          <div class="mrna-hero__crop" data-marker-crop>
            <img src="{{ url_for('assets', filename='hero/mrna/pink_spot_2.png') }}" alt="" draggable="false">
            <span class="mrna-marker-letter">C</span>
          </div>
          <span class="mrna-hero__debug-label mrna-hero__debug-label--right" aria-hidden="true">
            <b>#hero-marker-c-right · C</b>
            <span>Target (850, 570) · scale 0.5</span>
          </span>
        </div>

        <!-- 调试辅助网格与边界框 (只在 ?debugScene=1 / ?debugHero=1 时显现) -->
        <div class="mrna-debug-frame" aria-hidden="true">
          <div class="mrna-debug-center-guide"></div>
          <div class="mrna-debug-anchor" style="left: calc(610 / 1440 * 100%); top: calc(535 / 900 * 100%);" title="sideU (610, 535)"></div>
          <div class="mrna-debug-anchor" style="left: calc(720 / 1440 * 100%); top: calc(560 / 900 * 100%);" title="mainC (720, 560)"></div>
          <div class="mrna-debug-anchor" style="left: calc(850 / 1440 * 100%); top: calc(570 / 900 * 100%);" title="sideC (850, 570)"></div>
        </div>

      </div>

      <!-- 调试信息面板 -->
      <figcaption class="mrna-hero__debug-canvas" aria-hidden="true">
        <b>mRNA Minimal Scene (?debugScene=1)</b>
        <span>progress: <output data-hero-progress>0.000</output></span>
        <span>phase: <output data-hero-phase>Beat 1 (Wavy mRNA)</output></span>
        <span>viewport: 1440 × 900 guide</span>
      </figcaption>
    </figure>
  </div>
</section>
