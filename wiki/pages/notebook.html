{% extends "layout.html" %}
{% block title %}{{ content.title }}{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='notebook/notebook.css') }}">{% endblock %}
{% block main %}
<main id="main-content" class="notebook-page">
  <header class="nb-intro">
    <h1>{{ content.title }}<span>.</span></h1>
  </header>
  <section class="nb-app" data-notebook data-index="{{ url_for('static', filename='notebook/index.json') }}" aria-label="Interactive research notebook" aria-busy="true">
    <div class="nb-toolbar">
      <div class="nb-view-label"><button class="nb-back" type="button" data-back hidden aria-label="Return to timeline overview">← <span>Overview</span></button><span data-view-label>Research timeline</span></div>
      <label class="nb-track-switch" hidden data-switch-label>Track <select data-switch aria-label="Switch experimental track"></select></label>
      <label class="nb-jump" hidden data-jump-label>Jump to date <select data-jump aria-label="Jump to a recorded date"></select></label>
    </div>
    <div class="nb-caption"><p data-instruction>Select a line to follow its experiments.</p><span data-date-range></span></div>
    <div class="nb-focus-heading" data-focus-heading hidden tabindex="-1"></div>
    <div class="nb-viewport" data-viewport tabindex="0" aria-label="Timeline; scroll horizontally on small screens">
      <div class="nb-stage" data-stage>
        <svg class="nb-map" data-map aria-label="Calendar and experimental tracks" role="group"><g data-map-group></g></svg>
        <div class="nb-records" data-records></div>
      </div>
    </div>
    <div class="nb-end" data-end hidden></div>
    <nav class="nb-tracks" data-tracks aria-label="Experimental tracks"></nav>
    <p class="nb-status" data-status role="status" aria-live="polite"></p>
  </section>
  <noscript><p>The interactive timeline needs JavaScript. <a href="{{ url_for('static', filename='notebook/catalog.html') }}">Browse the source index</a> for every date, experiment title and original PDF.</p></noscript>
</main>
{% endblock %}
{% block page_scripts %}<script type="module" src="{{ url_for('static', filename='notebook/notebook.mjs') }}"></script>{% endblock %}
